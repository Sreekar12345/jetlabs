<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JetLabs Backend Architecture & Workflow</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1e293b;
      line-height: 1.6;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
      background-color: #fafafa;
    }
    .container {
      background-color: #ffffff;
      padding: 50px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      border: 1px solid #f1f5f9;
    }
    h1, h2, h3, h4 {
      color: #0f172a;
      font-weight: 700;
      margin-top: 1.8em;
      margin-bottom: 0.6em;
    }
    h1 {
      font-size: 2.5em;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 20px;
      margin-top: 0;
    }
    h2 {
      font-size: 1.8em;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 10px;
      margin-top: 1.8em;
    }
    h3 {
      font-size: 1.35em;
    }
    p {
      margin-top: 0;
      margin-bottom: 1.2em;
    }
    ul, ol {
      margin-top: 0;
      margin-bottom: 1.2em;
      padding-left: 24px;
    }
    li {
      margin-bottom: 0.5em;
    }
    code {
      font-family: Consolas, Monaco, "Andale Mono", monospace;
      background-color: #f1f5f9;
      padding: 3px 6px;
      border-radius: 6px;
      font-size: 0.9em;
      color: #0f172a;
    }
    pre {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 20px;
      border-radius: 10px;
      overflow-x: auto;
      margin-top: 0;
      margin-bottom: 1.5em;
      box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 0.06);
    }
    pre code {
      background-color: transparent;
      padding: 0;
      color: inherit;
      font-size: 0.9em;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1.5em;
      margin-bottom: 2em;
      font-size: 0.95em;
    }
    th, td {
      border: 1px solid #e2e8f0;
      padding: 12px 14px;
      text-align: left;
    }
    th {
      background-color: #f8fafc;
      font-weight: 600;
      color: #0f172a;
    }
    tr:nth-child(even) {
      background-color: #f8fafc;
    }
    hr {
      border: 0;
      border-top: 2px solid #f1f5f9;
      margin: 3em 0;
    }
    .mermaid {
      margin: 2.5em 0;
      display: flex;
      justify-content: center;
      background-color: #f8fafc;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: true, theme: 'default' });
  </script>
</head>
<body>
  <div class="container">
    ${htmlContent}
  </div>
</body>
</html>
